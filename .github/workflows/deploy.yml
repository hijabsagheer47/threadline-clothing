name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      delete_extra:
        description: "Server par woh files bhi delete karein jo repo mein nahi hain"
        type: boolean
        default: false

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run unit tests
        run: node --test tests/*.test.js

  deploy:
    name: Deploy to webspace
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install lftp and sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp sshpass

      - name: Sync files to IONOS via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
          DELETE_EXTRA: ${{ inputs.delete_extra }}
        run: |
          set -euo pipefail

          if [ -z "${SFTP_HOST}" ] || [ -z "${SFTP_USERNAME}" ] || [ -z "${SFTP_PASSWORD}" ]; then
            echo "::error::SFTP_HOST / SFTP_USERNAME / SFTP_PASSWORD secrets set nahi hain."
            exit 1
          fi

          PORT="${SFTP_PORT:-22}"
          TARGET="${REMOTE_DIR:-/mytechrcm/tayyabacollective}"

          # lftp's sftp backend shells out to ssh, which will not read a password
          # from lftp -- sshpass feeds it from the environment instead.
          export SSHPASS="${SFTP_PASSWORD}"
          SSH_PROG="sshpass -e ssh -a -x -p ${PORT}"
          SSH_PROG="${SSH_PROG} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          SSH_PROG="${SSH_PROG} -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          SSH_PROG="${SSH_PROG} -o NumberOfPasswordPrompts=1 -o LogLevel=ERROR"

          PREAMBLE="set sftp:auto-confirm yes;"
          PREAMBLE="${PREAMBLE} set sftp:connect-program \"${SSH_PROG}\";"
          PREAMBLE="${PREAMBLE} set net:max-retries 2; set net:timeout 30;"
          PREAMBLE="${PREAMBLE} set mirror:parallel-transfer-count 4;"

          # The password reaches ssh through SSHPASS, so lftp only needs the user.
          run_lftp() {
            lftp -u "${SFTP_USERNAME},unused" "sftp://${SFTP_HOST}" -e "${PREAMBLE} $1 bye"
          }

          echo "Login check..."
          if ! LOGIN_OUT=$(run_lftp "pwd; ls;" 2>&1); then
            echo "::error::SFTP login nahi hua."
            printf '%s\n' "${LOGIN_OUT}"
            exit 1
          fi
          echo "Login ok. Home directory contents:"
          printf '%s\n' "${LOGIN_OUT}"

          # IONOS SFTP accounts are scoped to a home directory, so the configured
          # path may be reachable in full or with that home prefix already stripped.
          CANDIDATES="${TARGET}"
          case "${TARGET}" in
            /*/*) CANDIDATES="${TARGET} /${TARGET#/*/}" ;;
          esac

          RESOLVED=""
          for candidate in ${CANDIDATES}; do
            echo "Trying remote path: ${candidate}"
            if OUT=$(run_lftp "cd \"${candidate}\"; pwd;" 2>&1) \
               && ! printf '%s' "${OUT}" | grep -qi "no such file\|access failed\|login failed"; then
              RESOLVED="${candidate}"
              echo "Resolved remote path: ${RESOLVED}"
              break
            fi
            echo "  not usable: $(printf '%s' "${OUT}" | tail -1)"
          done

          if [ -z "${RESOLVED}" ]; then
            echo "::error::Remote directory '${TARGET}' SFTP par nahi mili. Upar home directory ki listing dekhein."
            exit 1
          fi

          if [ "${DELETE_EXTRA:-false}" = "true" ]; then
            DELETE_FLAG="--delete"
          else
            DELETE_FLAG=""
          fi

          EXCLUDES="-x ^\.git/ -x ^\.github/ -x ^\.gitignore$ -x ^node_modules/ -x ^tests/ -x ^images/sources/ -x ^README\.md$ -x ^DEPLOY\.md$"

          run_lftp "mirror --reverse --verbose --continue ${DELETE_FLAG} ${EXCLUDES} ./ \"${RESOLVED}\";"

          echo "REMOTE_PATH_USED=${RESOLVED}" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          {
            echo "### Deployed to IONOS :rocket:"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Remote path: \`${REMOTE_PATH_USED}\`"
          } >> "$GITHUB_STEP_SUMMARY"
